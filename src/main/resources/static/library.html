<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css">
	<title>Accessibility Map - Library</title>
	<script src="script.js" data-building="Library" defer></script>
	<link rel="icon" type="image/png" href="Assets/BuildingPin.png"></link>
</head>
<body>
	<div class="mapContainer" id="pinContainer">
		<img src="Assets/LibraryMap.jpg" class="map libraryMap"></img>
		<a href="index.html" class="backButton">
			<p class="backButtonText">Back to Campus</p>
		</a>
		<div class="key">
			<p class="keyText title">Key</p>
			<div class="keyContent">
				<img src="Assets/RampPin.png" class="keyIcon ramp"></img>
				<p class="keyText body">Ramps</p>
			</div>
			<div class="keyContent">
				<img src="Assets/ElevatorPin.png" class="keyIcon ramp"></img>
				<p class="keyText body">Elevators</p>
			</div>
			<div class="keyContent">
				<img src="Assets/DoorPin.png" class="keyIcon ramp"></img>
				<p class="keyText body">Accessible Doors</p>
			</div>
			<div class="keyContent">
				<img src="Assets/WheelchairPin.png" class="keyIcon ramp"></img>
				<p class="keyText body">Public Wheelchairs</p>
			</div>
		</div>
	</div>
</body>
</html>
